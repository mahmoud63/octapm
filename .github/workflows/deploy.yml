name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write # required for OIDC
  contents: read

jobs:
  # ── Job 1: Build React SPA → S3 → CloudFront invalidation ──────
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync frontend/dist s3://${{ secrets.S3_SPA_BUCKET }} \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          # index.html must not be cached long
          aws s3 cp frontend/dist/index.html s3://${{ secrets.S3_SPA_BUCKET }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} \
            --paths "/*"

  # ── Job 2: SSH → git pull → npm ci → migrate → pm2 restart ─────
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: deploy-frontend

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key ec2-user@${{ secrets.EC2_HOST }} "bash -s" << EOF
            set -euo pipefail
            APP_DIR="/opt/pmcopilots"

            if [ ! -d "\$APP_DIR/.git" ]; then
              sudo git clone https://x-access-token:${GH_TOKEN}@github.com/mahmoud63/octapm.git "\$APP_DIR"
              sudo chown -R ec2-user:ec2-user "\$APP_DIR"
            else
              cd "\$APP_DIR"
              git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/mahmoud63/octapm.git
              git pull origin main
            fi

            cd "\$APP_DIR/backend"
            npm ci --omit=dev
            npx prisma migrate deploy
            pm2 restart pmcopilots-api || pm2 start src/index.js --name pmcopilots-api
            pm2 save
          EOF
