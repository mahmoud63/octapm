    The OctaPM app icon, as the brand book draws it: the eight-octagon ring in
    white on the Midnight Indigo to Turquoise gradient. The tile carries its own
    ground, so one icon works on a light or a dark browser chrome.
    The ring path is the supplied Illustrator artwork — do not redraw it.
