<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" role="img" aria-label="OctaPM">
  <!--
    The OctaPM mark: two octagonal blocks offset on the diagonal, reading as
    modular construction units locking together.

    Redrawn from the supplied brand reference so the product has a usable
    asset. If an official vector exists, replace this file with it — nothing
    in the code needs to change.

    `currentColor` lets one file serve both light and dark surfaces.
  -->
  <g fill="none" stroke="currentColor" stroke-width="13" stroke-linejoin="miter">
    <!-- Upper-left block -->
    <path d="M18.5 8.5h29L64 25v29L47.5 70.5h-29L2 54V25z" transform="translate(6.5 6.5) scale(0.86)" />
    <!-- Lower-right block, offset so the two interlock at the corner -->
    <path d="M18.5 8.5h29L64 25v29L47.5 70.5h-29L2 54V25z" transform="translate(50 34) scale(0.86)" />
  </g>
</svg>
