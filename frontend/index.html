<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      One icon for both colour schemes: the OctaPM app icon carries its own
      indigo-to-turquoise ground, so it reads on light and dark browser chrome
      alike and does not need a second, inverted version.
    -->
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Octa PM</title>
    <meta name="title" content="Octa PM" />
    <meta
      name="description"
      content="Octa PM construction project management dashboard."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://octapm.com" />
    <meta property="og:title" content="Octa PM" />
    <meta
      property="og:description"
      content="Octa PM construction project management dashboard."
    />
    <meta
      property="og:image"
      content="https://octapm.com/images/shadcn-admin.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://octapm.com" />
    <meta property="twitter:title" content="Octa PM" />
    <meta
      property="twitter:description"
      content="Octa PM construction project management dashboard."
    />
    <meta
      property="twitter:image"
      content="https://octapm.com/images/shadcn-admin.png"
    />

    <!--
      Typography. Space Grotesk is the OctaPM brand typeface — it carries the
      wordmark, headings and navigation, and gives the product its voice.
      Inter carries dense operational data (tables, forms, financial figures),
      where it is measurably more legible at small sizes. See
      docs/design/OCTAPM_PRODUCT_DESIGN_SYSTEM.md.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Midnight Indigo: the browser chrome matches the application shell. -->
    <meta name="theme-color" content="#0F1B64" />

    <!-- Installable app (OCTA-MOB-PWA-018) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OctaPM" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
